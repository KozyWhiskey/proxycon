&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };

   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))

      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)

      throw new TypeError(&quot;Widget state must be a JSON object&quot;);

      modelContent: null,
      privateContent: null,
      ...parsedState,
    };

    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,

      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),

      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();

#pc-design-reference { width:100%; }
#pc-design-reference * { box-sizing:border-box; }
#pc-design-reference [hidden] { display:none !important; }
#pc-design-reference .pc-stage { min-height:1060px; padding:0 0 24px; }
#pc-design-reference .pc-review { font:14px/1.5 &#x27;Manrope&#x27;,sans-serif; color:light-dark(#27323d,#e5e9ed); }
#pc-design-reference .pc-review-header { display:flex; flex-wrap:wrap; justify-content:space-between; gap:16px; padding:20px 0 16px; padding-right:96px; }
#pc-design-reference .pc-review-header h2 { font:600 27px/1.15 &#x27;Manrope&#x27;,sans-serif; color:inherit; margin:5px 0; }
#pc-design-reference .pc-caption { font:12px/1.5 &#x27;IBM Plex Mono&#x27;,monospace; letter-spacing:.07em; text-transform:uppercase; color:light-dark(#59636d,#b0b7bf); }
#pc-design-reference .pc-review-sub { font-size:13px; color:light-dark(#59636d,#b0b7bf); }
#pc-design-reference .pc-review-controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:0 0 18px; }
#pc-design-reference .pc-review-controls button { padding:10px 14px; min-height:44px; border:1px solid light-dark(#c8ced5,#414852); border-radius:8px; background:light-dark(#ffffff,#20252d); color:inherit; font:600 12px &#x27;Manrope&#x27;,sans-serif; }
#pc-design-reference .pc-review-controls button[aria-pressed=true] { background:light-dark(#29343f,#e2e7ec); color:light-dark(#fff,#17212b); border-color:transparent; }
#pc-design-reference .pc-review-controls .pc-theme-controls { margin-left:auto; display:flex; gap:6px; }
#pc-design-reference .pc-preview { --pc-brand:#FF873E; --pc-brand-ink:#21170F; --pc-display:&#x27;Fraunces&#x27;,Georgia,serif; --pc-body:&#x27;Manrope&#x27;,sans-serif; --pc-radius:12px; --pc-bg:#F2F4F5; --pc-surface:#FFFFFF; --pc-soft:#E8EDF0; --pc-ink:#1B222A; --pc-muted:#53616F; --pc-line:#CCD3DA; --pc-link:#A84209; --pc-info:#24559B; --pc-info-bg:#E8F0FF; --pc-good:#176341; --pc-good-bg:#E5F3EB; --pc-danger:#A92338; --pc-danger-bg:#FBE9ED; --pc-warn:#815100; --pc-warn-bg:#FFF1D2; font:14px/1.5 var(--pc-body); color:var(--pc-ink); }
#pc-design-reference .pc-preview[data-theme=dark] { --pc-bg:#12161B; --pc-surface:#1C232B; --pc-soft:#28323D; --pc-ink:#F1F3F5; --pc-muted:#AEBAC6; --pc-line:#45515D; --pc-link:#FFA469; --pc-info:#A3C9FF; --pc-info-bg:#20334E; --pc-good:#83D7AA; --pc-good-bg:#203C2E; --pc-danger:#FFABBA; --pc-danger-bg:#44242D; --pc-warn:#F1C879; --pc-warn-bg:#3D321F; }
#pc-design-reference .pc-preview h1,#pc-design-reference .pc-preview h2,#pc-design-reference .pc-preview h3,#pc-design-reference .pc-preview p { margin:0; color:inherit; }
#pc-design-reference .pc-preview button { font:600 13px/1.3 var(--pc-body); min-height:44px; padding:11px 14px; border:1px solid var(--pc-line); background:var(--pc-surface); color:var(--pc-ink); border-radius:calc(var(--pc-radius) * .65); display:inline-flex; align-items:center; justify-content:center; gap:8px; }
#pc-design-reference .pc-preview button:hover:not(:disabled) { background:var(--pc-soft); }
#pc-design-reference .pc-preview button.pc-main-action { background:var(--pc-brand); color:var(--pc-brand-ink); border-color:var(--pc-brand); }
#pc-design-reference .pc-preview button.pc-main-action:hover { background:#FF9D61; border-color:#FF9D61; }
#pc-design-reference .pc-preview button:active:not(:disabled) { transform:translateY(1px); }
#pc-design-reference .pc-preview button:disabled { background:var(--pc-soft); color:var(--pc-muted); opacity:.65; }
#pc-design-reference .pc-preview button.pc-selected { border-color:var(--pc-link); background:var(--pc-soft); box-shadow:inset 0 0 0 1px var(--pc-link); }
#pc-design-reference .pc-preview button.pc-text-action { background:transparent; border-color:transparent; color:var(--pc-link); padding-inline:2px; }
#pc-design-reference .pc-preview button svg { width:16px; height:16px; flex:none; }
#pc-design-reference .pc-preview .pc-kicker { font:500 12px/1.4 &#x27;IBM Plex Mono&#x27;,monospace; text-transform:uppercase; letter-spacing:.07em; color:var(--pc-muted); }
#pc-design-reference .pc-preview .pc-muted { color:var(--pc-muted); }
#pc-design-reference .pc-preview .pc-heading { font-family:var(--pc-display); font-weight:600; letter-spacing:-.025em; line-height:1.15; }
#pc-design-reference .pc-phone-pair { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:28px; max-width:810px; margin:0 auto; align-items:start; }
#pc-design-reference .pc-phone-label { color:light-dark(#59636d,#b0b7bf); font:500 12px &#x27;IBM Plex Mono&#x27;,monospace; letter-spacing:.1em; text-transform:uppercase; margin-bottom:12px; }
#pc-design-reference .pc-phone { background:var(--pc-bg); border:1px solid var(--pc-line); border-radius:20px; overflow:hidden; max-width:390px; margin:auto; }
#pc-design-reference .pc-topbar { display:flex; justify-content:space-between; align-items:center; padding:19px 20px 14px; gap:12px; background:var(--pc-surface); border-bottom:1px solid var(--pc-line); }
#pc-design-reference .pc-wordmark { font:700 21px/1.1 &#x27;Manrope&#x27;,sans-serif; letter-spacing:-1px; display:flex; align-items:center; gap:7px; }
#pc-design-reference .pc-wordmark em { color:var(--pc-link); font-style:normal; }
#pc-design-reference .pc-wordmark svg { width:20px; height:23px; color:var(--pc-muted); }
#pc-design-reference .pc-person { display:flex; align-items:center; gap:5px; font-size:12px; color:var(--pc-muted); }
#pc-design-reference .pc-mana { display:inline-flex; align-items:center; gap:3px; }
